<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="revision-forge: course documents to design folder to live revision site">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1a2b"/>
      <stop offset="1" stop-color="#16263d"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b7aa3"/>
    </marker>
  </defs>

  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>

  <!-- title -->
  <text x="64" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="700" fill="#f1f5f9">revision<tspan fill="url(#spark)">-forge</tspan></text>
  <text x="66" y="176" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#a8b8cf">Turn a course into an interactive revision website,</text>
  <text x="66" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#a8b8cf">with two Claude skills.</text>
  <text x="66" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#6f86a6">search · workshop · interactive diagrams · mock exams</text>

  <!-- pipeline -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" text-anchor="middle">
    <!-- docs -->
    <g transform="translate(760,96)">
      <rect x="-50" y="0" width="100" height="128" rx="10" fill="#1e3350" stroke="#33507a"/>
      <rect x="-32" y="22" width="64" height="6" rx="3" fill="#4b6890"/>
      <rect x="-32" y="38" width="48" height="6" rx="3" fill="#4b6890"/>
      <rect x="-32" y="54" width="58" height="6" rx="3" fill="#4b6890"/>
      <rect x="-32" y="70" width="40" height="6" rx="3" fill="#4b6890"/>
      <text y="152" fill="#a8b8cf">your course</text>
    </g>
    <line x1="822" y1="160" x2="886" y2="160" stroke="#5b7aa3" stroke-width="2.5" marker-end="url(#arrow)"/>
    <!-- folder -->
    <g transform="translate(950,96)">
      <rect x="-50" y="0" width="100" height="128" rx="10" fill="#1e3350" stroke="url(#spark)" stroke-width="2"/>
      <text y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#f59e0b">.md</text>
      <text y="80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#f59e0b">+ yaml</text>
      <text y="152" fill="#a8b8cf">design folder</text>
    </g>
    <line x1="1012" y1="160" x2="1076" y2="160" stroke="#5b7aa3" stroke-width="2.5" marker-end="url(#arrow)"/>
    <!-- site -->
    <g transform="translate(1150,96)">
      <rect x="-56" y="0" width="112" height="128" rx="10" fill="#1e3350" stroke="#33507a"/>
      <rect x="-56" y="0" width="112" height="20" rx="10" fill="#28456b"/>
      <circle cx="-42" cy="10" r="3.5" fill="#f97316"/>
      <circle cx="-31" cy="10" r="3.5" fill="#f59e0b"/>
      <circle cx="-20" cy="10" r="3.5" fill="#22c55e"/>
      <polyline points="-40,96 -22,72 -4,84 14,52 36,62" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="14" cy="52" r="5" fill="#f59e0b"/>
      <rect x="-40" y="104" width="76" height="5" rx="2.5" fill="#4b6890"/>
      <text y="152" fill="#a8b8cf">live site</text>
    </g>
  </g>
</svg>
